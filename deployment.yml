apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: spring-app
          image: sharvilvajja/spring-boot-cicd-pipeline:v46  # use 'latest' tag
          imagePullPolicy: Always                        # ensures the latest image is pulled
          ports:
            - containerPort: 8181
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name