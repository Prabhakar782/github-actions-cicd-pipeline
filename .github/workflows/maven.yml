name: Java CI + Docker + Kubernetes Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Build Spring Boot JAR
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Build & Push Docker Image (VERSIONED)
      - name: Build & Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: sharvilvajja/spring-boot-cicd
          tags: v${{ github.run_number }}
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      # 6️⃣ Configure Kubernetes access
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIGS }}" | base64 -d > $HOME/.kube/config

      # 7️⃣ Update image version inside deployment.yml
      - name: Update Kubernetes deployment image
        run: |
          sed -i "s|image: .*|image: sharvilvajja/spring-boot-cicd:v${{ github.run_number }}|" deployment.yml

      # 8️⃣ Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

      # 9️⃣ (Optional) Verify rollout
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/spring-app