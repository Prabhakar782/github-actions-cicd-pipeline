name: Java CI + Sonar + Docker + Azure Deploy (Stable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean verify

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Prabhakar782_github-actions-cicd-pipeline \
            -Dsonar.organization=prabhakar782 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

  manual-review:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: manual-approval   # 🔴 Manual approval gate

    steps:
      - name: Waiting for self review
        run: echo "Review Sonar results and approve to continue"

  docker-build:
    needs: manual-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Docker Build & Push
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: sharvilvajja/spring-boot-cicd-pipeline
          tags: v${{ github.run_number }}
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  deploy-to-azure:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure Web App (Docker)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: sharvilvajja/spring-boot-cicd-pipeline:v${{ github.run_number }}