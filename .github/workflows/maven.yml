name: Java CI + Sonar + Docker (Stable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean verify

      - name: SonarCloud Scan (NO CLI PROPS)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: mvn sonar:sonar -Dsonar.login=$SONAR_TOKEN

      - name: Docker Build & Push
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: sharvilvajja/spring-boot-cicd-pipeline
          tags: v${{ github.run_number }}
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}